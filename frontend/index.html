    <!--
      Synchronous canonical tag — runs BEFORE React hydrates.
      This is the KEY fix for GSC "Duplicate without user-selected canonical":
      Googlebot's first-pass crawl ALWAYS sees a canonical, even if JS never runs.
    -->
    <script>
    (function() {
      'use strict';
      var p = window.location.pathname.replace(/\/+$/, '') || '/';
      var h = window.location.host;
      var proto = 'https:';
      // Build canonical URL
      var canonical = proto + '//' + h + p;
      var link = document.createElement('link');
      link.rel = 'canonical';
      link.href = canonical.toLowerCase();
      document.head.appendChild(link);
    })();
    </script>
