server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Six product images at 10 MiB each, plus multipart overhead.
    client_max_body_size 65M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Two-tier proxy: recover the true client IP from the trusted edge ──
    #
    # Production request path:
    #   client → Pi5 edge reverse proxy (192.168.100.50) → this nginx → backend
    # The edge is the public TLS terminator and REPLACES X-Forwarded-For with the
    # real client address, but the TCP peer THIS nginx sees is the edge, so
    # $remote_addr is the edge's own address for every visitor. Without the
    # realip module the backend therefore sees one shared client IP and slowapi
    # (keyed on request.client.host via get_remote_address) buckets every caller
    # together — one visitor could exhaust the shared login limit.
    #
    # realip rewrites $remote_addr from X-Forwarded-For, but ONLY when the
    # immediate peer matches a `set_real_ip_from` entry. We trust exactly the one
    # edge address — never a CIDR range and never "*" — so a caller that reaches
    # this server directly (e.g. the published :3000 port, whose peer is NOT the
    # edge) keeps $remote_addr = its real peer and CANNOT forge a client IP via
    # X-Forwarded-For. `real_ip_recursive on` walks the forwarded chain
    # right-to-left and picks the first untrusted hop, so a client-supplied
    # prefix cannot win either. Update this literal to the edge's address if the
    # edge moves; keep it to a single exact address.
    set_real_ip_from 192.168.100.50;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Default proxy headers for all backend proxy locations.
    #
    # X-Forwarded-For is OVERWRITTEN with $remote_addr — the realip-recovered
    # client IP when the request arrived from the trusted edge, or the true
    # direct peer otherwise — never appended ($proxy_add_x_forwarded_for) and
    # never the client-supplied $http_x_forwarded_for. So no client-controlled
    # chain ever reaches the backend, which derives its rate-limit key from
    # request.client.host. The backend trusts only this proxy's fixed IP via
    # --forwarded-allow-ips (see docker-compose.yml).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # $scheme (nginx terminates the request), not the client-supplied
    # $http_x_forwarded_proto header, so the client cannot spoof http/https.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # ── Token-bearing public invoice API — never logged ──────────────────
    # The public invoice token is a URL path credential and the pay page hits
    # it on EVERY load:
    #   GET  /api/v1/commerce/invoices/<token>
    #   POST /api/v1/commerce/invoices/<token>/pay
    # The generic `location ^~ /api/` below keeps access logging ON, so those
    # request lines would write the token to the log. An `^~` prefix match
    # stops regex evaluation, so a bare `~*` block would be SHADOWED for the
    # real (lower-case) path — the token would still leak. The specific block
    # is therefore a LONGER `^~` PREFIX, which beats `^~ /api/` by nginx's
    # longest-prefix rule (order does not matter for prefixes). A mixed/upper
    # case variant (/API/…) does not match the case-SENSITIVE `^~ /api/` and
    # so reaches regex evaluation, where the companion `~*` block wins; it must
    # precede the static-asset regex below so a token that looks like an asset
    # is still handled here. Both blocks proxy to the backend identically (no
    # URI in proxy_pass ⇒ the request URI is forwarded unchanged) and disable
    # the access log. Server-level proxy_set_header / add_header still apply.
    location ^~ /api/v1/commerce/invoices/ {
        access_log off;
        proxy_pass http://backend:8000;
    }
    location ~* ^/api/v1/commerce/invoices/ {
        access_log off;
        proxy_pass http://backend:8000;
    }

    # ── SnappPay onboarding callback — query string never logged ─────────
    # The registered onboarding URL is the fixed path
    #   /api/v1/commerce/snappay/callback
    # SnappPay has issued no protocol, so the stub does not parse this route's
    # query string: any value there (signature, token, amount …) is unknown and
    # must be assumed sensitive. By default the request falls under the logged
    # `location ^~ /api/`, which would write that whole query to the access log.
    # A dedicated `^~` prefix for the exact callback path wins over `^~ /api/`
    # by nginx's longest-prefix rule (order-independent for prefixes; an `^~`
    # match stops regex evaluation, so a bare `~*` block would be shadowed for
    # the real lower-case path). A companion `~*` block covers mixed-case
    # variants — which miss the case-SENSITIVE `^~` and reach regex evaluation —
    # and MUST precede the static-asset regex below so a callback-shaped asset
    # path is handled here rather than served from the immutable-cache branch.
    # Both blocks proxy with no URI in proxy_pass, so the request URI (including
    # any query) is forwarded to the backend unchanged, exactly like `^~ /api/`.
    location ^~ /api/v1/commerce/snappay/callback {
        access_log off;
        proxy_pass http://backend:8000;
    }
    location ~* ^/api/v1/commerce/snappay/callback {
        access_log off;
        proxy_pass http://backend:8000;
    }

    # ── BitPay gateway callback — trans_id / id_get never logged ─────────
    # The gateway GET-callbacks the fixed path
    #   /api/v1/commerce/bitpay/callback?trans_id=<n>&id_get=<n>
    # trans_id / id_get identify the transaction, and this deployment never
    # logs a callback query string (same rule as the SnappPay stub above). A
    # dedicated `^~` block for the exact path wins over `^~ /api/` by nginx's
    # longest-prefix rule, and a companion `~*` covers mixed-case variants that
    # miss the case-SENSITIVE `^~`. Both proxy with no URI in proxy_pass so the
    # request URI (including any query) reaches the backend unchanged.
    location ^~ /api/v1/commerce/bitpay/callback {
        access_log off;
        proxy_pass http://backend:8000;
    }
    location ~* ^/api/v1/commerce/bitpay/callback {
        access_log off;
        proxy_pass http://backend:8000;
    }

    # Proxy API requests to the backend (^~ stops regex matching)
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
    }

    # Dynamic sitemap (products + static pages) from backend
    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/v1/sitemap.xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # Dynamic robots.txt
    location = /robots.txt {
        proxy_pass http://backend:8000/api/v1/robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy uploaded images to backend (^~ prevents static regex from capturing /uploads/*.webp)
    location ^~ /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        # Cache uploaded files (images, logos) for 7 days
        add_header Cache-Control "public, max-age=604800";
    }

    # Service worker must never be cached — otherwise browsers keep a stale
    # SW (and its cached shell/assets) for days and never pick up releases.
    # Exact match beats the .js regex below.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── Token-free gateway hand-off page — /pay/redirect ─────────────────
    # The private invoice page (/pay/<token>) is served `Referrer-Policy:
    # no-referrer` because the path segment is a bearer credential. A direct
    # browser navigation from that document to the BitPay portal therefore
    # carries NO Referer, and BitPay rejects the hand-off with «آدرس ارجاعی
    # نامعتبر» (invalid referer address). The pay page instead hard-navigates
    # to this token-free page, which is served with an ORIGIN-only referrer
    # policy so the browser emits `Referer: https://spaghettiprints.ir/`
    # (scheme+host+port only — never the path, a query or any token) on the
    # outbound navigation to the portal.
    #
    # Exact match (`=`) beats the case-insensitive `~* ^/pay/` regex below by
    # nginx precedence (order does not matter), so this page's policy cannot
    # weaken the token-bearing routes: every /pay/<token> URI still matches that
    # regex and keeps no-referrer + no-store. Access logging stays off — the
    # page is token-free, but nothing from the payment-adjacent path should ever
    # reach the log. add_header does not inherit, so every server-level security
    # header is restated. The SPA fallback is `rewrite ... break` (never
    # try_files) so these headers survive the internal redirect to /index.html.
    location = /pay/redirect {
        access_log off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;

        rewrite ^ /index.html break;
    }

    # Token-bearing payment routes, matched CASE-INSENSITIVELY.
    #
    # The public invoice page lives at /pay/<token> (the token in the path IS
    # the credential) and the token-free result page at /pay/result.  nginx
    # prefix locations (`location ^~ /pay/`) are case-SENSITIVE, but React
    # Router v7 matches these routes case-insensitively — so a browser or a
    # social crawler asking for /PAY/<token> or /Pay/<token> previously fell
    # through to the plain `location /` block.  That leaked the token two ways:
    #   1. the bot UA branch proxied to the upstream meta-preview handler,
    #      which echoes the requested $uri back in og:url/canonical, and
    #   2. the non-bot branch served the SPA shell WITHOUT no-referrer /
    #      no-store, so the token could escape via Referer and be cached.
    # A case-insensitive regex location closes both holes for every case
    # variant at once (regex locations are evaluated before the plain prefix
    # `location /`, regardless of order).
    #
    # Placement matters: this block MUST precede the static-asset regex
    # (`~* \.(js|...)$`) so a token that happens to look like an asset
    # (/pay/<token>.js) is still handled here and never served through the
    # immutable-cache asset branch.  It must also precede `~* \.html$`.
    #
    # add_header does NOT inherit once a location declares any add_header, so
    # every server-level security header is restated below; omitting them would
    # be a security regression on the most sensitive pages.
    # The SPA fallback is `rewrite ... break` rather than try_files on purpose:
    # try_files' internal redirect to /index.html re-matches `location ~* \.html$`
    # and would drop exactly the headers set here.
    location ~* ^/pay/ {
        # The path segment after /pay/ is the bearer token credential. Never
        # write it to the access log: disable access logging for this location
        # (covers every case variant via the case-insensitive regex). Error logs
        # are left on; the security headers below are retained.
        access_log off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;

        rewrite ^ /index.html break;
    }

    # ── One-visit «سفارش‌های من» — never cached, never referrer-linked ──────
    # The public history page is a session-ENTRY document: the customer proves
    # ownership of a mobile number with an SMS code and the short-lived bearer
    # lives only in that tab's sessionStorage. The document carries no token and
    # no personal data (the history itself arrives through the no-store
    # /api/v1/commerce/history calls), but it is still served `no-store` so no
    # intermediary can replay a stale shell, and `no-referrer` so a
    # session-bearing URL can never leak to an external asset. Access logging is
    # off as defence in depth: the page must never carry a personal query string,
    # and this guarantees such a string could not be written to the log even if
    # one were introduced later. Matched CASE-INSENSITIVELY because React Router
    # resolves /MY-ORDERS and /My-Orders too; the `(/|$)` boundary stops it
    # matching lookalikes such as /my-orders-archive.
    #
    # Placement: regex locations are tried in the order they appear, so this MUST
    # precede the static-asset regex below — otherwise a hypothetical
    # /my-orders.js would be served through the immutable-cache asset branch.
    #
    # add_header does NOT inherit once a location declares any add_header, so
    # every server-level security header is restated; the SPA fallback is
    # `rewrite ... break` (never try_files) so these headers survive the internal
    # redirect to /index.html.
    location ~* ^/my-orders(/|$) {
        access_log off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;

        rewrite ^ /index.html break;
    }

    # Cache static frontend assets (JS/CSS bundles, static icons, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Dynamic meta-tags preview for social crawlers across all SPA routes (Telegram, WhatsApp, Twitter, Facebook, Discord, etc.)
    location / {
        if ($http_user_agent ~* "TelegramBot|Twitterbot|facebookexternalhit|WhatsApp|Discordbot|vkShare|Slackbot|LinkedInBot|Pinterest|Baiduspider|SkypeUriPreview|Google-Structured-Data-Testing-Tool") {
            proxy_pass http://backend:8000/api/v1/meta-preview?uri=$uri;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for HTML (SPA entry point)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
