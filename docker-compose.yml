services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    ports:
      - "8080:8000"
    volumes:
      - db_data:/app/data
      - uploads_data:/app/uploads
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # Every other variable — JWT_SECRET, CORS_ORIGINS, COOKIE_SECURE, … — is
      # loaded from backend/.env via env_file above. Do NOT re-declare them here:
      # a value in `environment:` takes precedence over `env_file:`, and any
      # compose-interpolated entry (e.g. CORS_ORIGINS=${CORS_ORIGINS:-}) is
      # resolved from the *project-root* .env/shell — NOT backend/.env — so it
      # silently shadows the real backend/.env value with an empty string when
      # unset. That shadowing was a live bug: CORS_ORIGINS came back empty and
      # app/main.py fell back to http://localhost:5173 instead of the deployed
      # origin configured in backend/.env.
    # The backend is only reached through the frontend nginx proxy on this
    # network, so uvicorn must trust X-Forwarded-For *only* from nginx. nginx is
    # pinned to the static IP 172.28.0.2 below; trusting that single fixed host
    # (never "*") means a direct request to the published :8080 port — whose peer
    # is not the proxy — cannot forge its client IP, while real clients proxied
    # through nginx are rate-limited by their true address (slowapi keys on
    # request.client.host via get_remote_address).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "172.28.0.2"]
    networks:
      commerce_net:
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Static IP so the backend can name exactly this proxy in
    # --forwarded-allow-ips (Docker assigns container IPs dynamically otherwise).
    networks:
      commerce_net:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  # Dedicated network with a fixed subnet so nginx can be pinned to a stable IP
  # that the backend trusts for X-Forwarded-For.
  commerce_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
